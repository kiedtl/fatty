[package]
name = "fatty"
version = "0.1.0"
edition = "2024"
default-run = "fatty"

[dependencies]
anyhow = "1.0.104"
bitflags = "2.11.0"
brandywine = { path = "../brandywine" }
chrono = "0.4.45"
clap = { version = "4.6.0", features = ["derive"] }
futures = "0.3.32"
glob = "0.3.3"
iced_core = { git = "https://github.com/iced-rs/iced", rev = "2b571f3f082bd9cfe342ea7ee528a0248dc5f734" }
iced = { git = "https://github.com/iced-rs/iced", rev = "2b571f3f082bd9cfe342ea7ee528a0248dc5f734", features = [ "advanced", "image", "canvas", "qr_code", "tokio" ]}
image = { version = "0.25", default-features = false, features = ["avif", "bmp", "gif", "ico", "jpeg", "png", "webp"] }
inotify = "0.11.1"
itertools = "0.14.0"
libc = "0.2.184"
marish = { path = "../marish" }
num-traits = "0.2.19"
raw-window-handle = "0.6"
rustix-openpty = "0.2.0"
rustix = { version = "1.1.4", features = ["net"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.51.0", features = ["sync"] }
unicode-segmentation = "1.13.2"
vte = { version = "0.15.0", features = ["bitflags", "ansi"] }
serde_json = "1.0.151"
dirs = "6.0.0"
